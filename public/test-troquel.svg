<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" 
     viewBox="0 0 400 300" 
     width="400mm" height="300mm">
  
  <!-- TROQUEL DE PRUEBA: Caja simple con ventana circular -->
  <!-- Dimensiones conocidas: 400mm x 300mm -->
  
  <!-- Borde exterior (CORTE) -->
  <rect x="20" y="20" width="360" height="260" 
        fill="none" stroke="#ff0000" stroke-width="1"/>
  
  <!-- Líneas de doblez (DOBLEZ) -->
  <line x1="120" y1="20" x2="120" y2="280" 
        stroke="#0000ff" stroke-width="0.5" stroke-dasharray="6 4"/>
  <line x1="280" y1="20" x2="280" y2="280" 
        stroke="#0000ff" stroke-width="0.5" stroke-dasharray="6 4"/>
  <line x1="20" y1="100" x2="380" y2="100" 
        stroke="#0000ff" stroke-width="0.5" stroke-dasharray="6 4"/>
  <line x1="20" y1="200" x2="380" y2="200" 
        stroke="#0000ff" stroke-width="0.5" stroke-dasharray="6 4"/>
  
  <!-- Ventana circular (CORTE) -->
  <circle cx="200" cy="150" r="40" 
          fill="none" stroke="#ff0000" stroke-width="1"/>
  
  <!-- Solapa de pegue (CORTE) -->
  <path d="M380,120 L400,130 L400,170 L380,180" 
        fill="none" stroke="#ff0000" stroke-width="1"/>
  
  <!-- Perforaciones de ventilación (PERFORACIÓN) -->
  <line x1="60" y1="50" x2="80" y2="50" 
        stroke="#00aa00" stroke-width="0.5" stroke-dasharray="2 2"/>
  <line x1="60" y1="60" x2="80" y2="60" 
        stroke="#00aa00" stroke-width="0.5" stroke-dasharray="2 2"/>
  <line x1="60" y1="70" x2="80" y2="70" 
        stroke="#00aa00" stroke-width="0.5" stroke-dasharray="2 2"/>
  
  <!-- Elemento auxiliar / guía (AUXILIAR) -->
  <line x1="200" y1="0" x2="200" y2="300" 
        stroke="#cccccc" stroke-width="0.25" stroke-dasharray="1 3"/>
        
</svg>
